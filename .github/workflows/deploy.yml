name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # ডেটা-স্তরের যাচাই — TypeScript যা ধরতে পারে না (mermaid সিনট্যাক্স,
      # step-এর node/edge রেফারেন্স)। build-এর আগে, যাতে ভাঙা ডেটা deploy না হয়।
      - name: Check diagrams
        run: npm run check:diagrams

      - name: Check simulations
        run: npm run check:simulations

      - name: Build and Export
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
